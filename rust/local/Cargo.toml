[package]
name = "local"
version = "0.1.0"
edition = "2021"
publish = false
links = "local"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
kv = { path = "../kv" }
cxx = "1"
csv = "1.3"
serde_json = { version = "1", features = ["preserve_order"] }
parquet = { version = "57", default-features = false, features = ["snap", "brotli", "flate2-zlib-rs", "lz4", "zstd"] }
libc = "0.2"

[build-dependencies]
cxx-build = "1"
